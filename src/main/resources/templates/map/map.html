<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Toilet Map</title>

    <!-- Kakao Maps SDK (autoload=false 로드 제어) -->
    <script th:src="@{'https://dapi.kakao.com/v2/maps/sdk.js'
                + '?appkey=' + ${kakaoApiKey}
                + '&libraries=services&autoload=false'}"></script>

    <style>
        /* 범례 */
        .legend {
          position: absolute; z-index: 10; top: 12px; left: 12px;
          background: #fff; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
          padding: 8px 10px; font-size: 13px; line-height: 1.35;
        }
        .legend .row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
        .swatch { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,.15); }

        /* 인포윈도우 별점 시각화 */
        .iw-stars { position: relative; display: inline-block; line-height: 1; vertical-align: middle; font-size: 18px; }
        .iw-stars-outer { color: #c9c9c9; }
        .iw-stars-inner { position: absolute; top: 0; left: 0; white-space: nowrap; overflow: hidden; color: #ffb400; }

        /* 데이터 상태 배너 */
        .status {
          position: absolute; z-index: 10; top: 12px; right: 12px;
          background:#fff; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
          padding: 8px 10px; font-size: 12px; color:#333; min-width: 140px; text-align: right;
        }
        .status .ok { color:#2e7d32; }
        .status .warn { color:#c62828; }
    </style>
</head>
<body>
<div id="map" style="width:100%; height:100vh; position: relative;"></div>

<div class="legend" aria-hidden="true">
    <div class="row"><span class="swatch" style="background:#1E88E5"></span> 남자 화장실</div>
    <div class="row"><span class="swatch" style="background:#E53935"></span> 여자 화장실</div>
    <div class="row"><span class="swatch" style="background:#FDD835"></span> 장애인 화장실</div>
    <div class="row"><span class="swatch" style="background:#757575"></span> 기타/알 수 없음</div>
</div>

<!-- 데이터 상태 배너 -->
<div id="status" class="status">데이터 로딩 중…</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    kakao.maps.load(function() {
      const statusEl = document.getElementById('status');

      function setStatus(html, ok=true) {
        statusEl.innerHTML = html;
        statusEl.querySelectorAll('.ok,.warn').forEach(()=>{});
        statusEl.classList.remove('is-error');
        statusEl.classList.toggle('is-error', !ok);
      }

      // 1) 초기 위치로 지도 렌더링
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => initMap(pos.coords.latitude, pos.coords.longitude),
          err => { console.warn('위치 정보 불가, 기본 위치 사용', err); initMap(37.566826, 126.9786567); },
          { enableHighAccuracy: true, timeout: 3000 }
        );
      } else {
        initMap(37.566826, 126.9786567);
      }

      // 2) 지도 + 마커/인포윈도우 로직
      function initMap(lat, lng) {
        const map = new kakao.maps.Map(document.getElementById('map'), {
          center: new kakao.maps.LatLng(lat, lng), level: 3
        });

        if (navigator.geolocation) {
          navigator.geolocation.watchPosition(
            pos => map.setCenter(new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude)),
            console.error,
            { enableHighAccuracy: true, maximumAge: 30000, timeout: 27000 }
          );
        }

        // 마커 이미지
        const makePinDataUrl = (fill, dotFill = '#ffffff') => {
          const svg =
            `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 64">
               <defs><filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
                 <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.35"/></filter></defs>
               <path fill="${fill}" filter="url(#shadow)"
                     d="M24 0C12.954 0 4 8.954 4 20c0 13.255 20 44 20 44s20-30.745 20-44C44 8.954 35.046 0 24 0z"/>
               <circle cx="24" cy="20" r="7" fill="${dotFill}"/>
             </svg>`;
          return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
        };
        const COLORS = {
          male: { normal:'#1E88E5', active:'#1565C0' },
          female: { normal:'#E53935', active:'#C62828' },
          disabled: { normal:'#FDD835', active:'#F9A825' },
          unknown: { normal:'#757575', active:'#424242' }
        };
        const imageSize = new kakao.maps.Size(36, 48);
        const imageOpt  = { offset: new kakao.maps.Point(18, 48) };
        const markerImage = (type, active=false) =>
          new kakao.maps.MarkerImage(makePinDataUrl(COLORS[type][active?'active':'normal']), imageSize, imageOpt);

        const inferType = (t) => {
          if (t.markerType) return t.markerType;
          const v4 = (t.value04 || t.value_04 || '').toString();
          const v5 = (t.value05 || t.value_05 || '').toString();
          if (/장애/.test(v4) || /장애/.test(v5)) return 'disabled';
          const hasM = /남/.test(v4), hasF = /여/.test(v4);
          if (hasM && !hasF) return 'male';
          if (!hasM && hasF) return 'female';
          return 'unknown';
        };

        let openInfoWindow = null;
        let openMarker     = null;

        // 3) 데이터 로드
        fetch(/*[[@{/toilets}]]*/)
          .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
          .then(toilets => {
            if (!Array.isArray(toilets) || toilets.length === 0) {
              setStatus('<span class="warn">데이터 0건</span>', true);
              return;
            }
            setStatus(`<span class="ok">로딩 완료</span> · ${toilets.length}건`);
            toilets.forEach(t => {
              const type = inferType(t);
              const position = new kakao.maps.LatLng(t.coordY, t.coordX);
              const marker   = new kakao.maps.Marker({ map, position, image: markerImage(type, false) });

              const avgNum  = t.avgRating != null ? Number(t.avgRating) : 0;
              const avgTxt  = avgNum.toFixed(1);
              const cnt     = t.reviewCount != null ? t.reviewCount : 0;
              const percent = Math.max(0, Math.min(100, (avgNum/5)*100)).toFixed(0);

              const content = `
                <div class="draggable-iw" style="padding:8px;font-size:14px;max-width:260px;
                     max-height:200px;overflow-y:auto;word-break:break-word;">
                  <div style="display:flex;align-items:center;gap:6px;">
                    <i class="bi bi-badge-wc" aria-hidden="true" style="font-size:20px;"></i>
                    <strong style="font-size:18px;line-height:1.2;">${t.contsName ?? ''}</strong>
                  </div>
                  <div style="margin-top:8px; display:flex; align-items:center; gap:6px;">
                    <a href="/reviews?toiletId=${t.id}"
                       style="text-decoration:none; color:inherit; display:inline-flex; align-items:center; gap:6px;">
                      <span class="iw-stars" aria-label="평균 ${avgTxt}점">
                        <span class="iw-stars-outer">★★★★★</span>
                        <span class="iw-stars-inner" style="width:${percent}%">★★★★★</span>
                      </span>
                      <span>${avgTxt} / 5</span>
                    </a>
                    <span style="color:#888;">(${cnt})</span>
                  </div>
                  <div style="margin-top:6px;color:#222;">
                    ${t.addrNew ? ('도로명: ' + t.addrNew + '<br>') : ''}
                    ${t.addrOld ? ('지번: ' + t.addrOld) : ''}
                  </div>
                </div>`;
              const infoWindow = new kakao.maps.InfoWindow({ content });

              kakao.maps.event.addListener(marker, 'click', function () {
                if (openInfoWindow && openMarker === marker) {
                  openInfoWindow.close(); marker.setImage(markerImage(type, false));
                  openInfoWindow = openMarker = null; return;
                }
                if (openInfoWindow && openMarker) {
                  openInfoWindow.close();
                  openMarker.setImage(openMarker.__inactiveImage || markerImage('unknown', false));
                }
                marker.__inactiveImage = markerImage(type, false);

                const bounds = map.getBounds();
                if (!bounds.contain(position)) map.panTo(position);

                infoWindow.open(map, marker);
                marker.setImage(markerImage(type, true));
                openInfoWindow = infoWindow; openMarker = marker;

                setTimeout(() => {
                  const inner = document.querySelector('.draggable-iw');
                  if (inner) {
                    const wrapper = inner.parentElement && inner.parentElement.parentElement;
                    if (wrapper) wrapper.style.height = inner.scrollHeight + 'px';
                  }
                }, 50);
              });
            });
          })
          .catch(err => {
            console.error('데이터 로드 실패:', err);
            setStatus('<span class="warn">데이터 로드 실패</span> · 콘솔 확인', false);
          });
      }
    });
    /*]]>*/
</script>
</body>
</html>
