<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Public Toilet Map</title>

    <script th:src="@{'https://dapi.kakao.com/v2/maps/sdk.js'
      + '?appkey=' + ${kakaoApiKey}
      + '&libraries=services,clusterer&autoload=false'}"></script>

    <style>
        .legend {
          position: absolute; z-index: 10; top: 12px; left: 12px;
          background: #fff; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
          padding: 8px 10px; font-size: 13px; line-height: 1.35;
        }
        .legend .row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
        .swatch { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,.15); }

        .iw-stars { position: relative; display: inline-block; line-height: 1; vertical-align: middle; font-size: 18px; }
        .iw-stars-outer { color: #c9c9c9; }
        .iw-stars-inner { position: absolute; top: 0; left: 0; white-space: nowrap; overflow: hidden; color: #ffb400; }

        .status {
          position: absolute; z-index: 10; top: 12px; right: 12px;
          background:#fff; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
          padding: 8px 10px; font-size: 12px; color:#333; min-width: 160px; text-align: right;
        }
        .status.ok { color:#2e7d32; }
        .status.warn { color:#c62828; }
    </style>
</head>

<body>
<div id="map" style="width:100%; height:100vh; position: relative;"></div>

<div class="legend" aria-hidden="true">
    <div class="row"><span class="swatch" style="background:#1E88E5"></span> 남자 화장실</div>
    <div class="row"><span class="swatch" style="background:#E53935"></span> 여자 화장실</div>
    <div class="row"><span class="swatch" style="background:#FDD835"></span> 장애인 화장실</div>
    <div class="row"><span class="swatch" style="background:#757575"></span> 기타</div>
</div>

<div id="status" class="status">데이터 로드 중...</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    kakao.maps.load(function() {
      const statusEl = document.getElementById('status');
      function setStatus(text, tone='ok') {
        statusEl.textContent = text;
        statusEl.classList.remove('ok', 'warn');
        statusEl.classList.add(tone === 'warn' ? 'warn' : 'ok');
        statusEl.classList.remove('is-error');
        statusEl.classList.toggle('is-error', tone === 'warn');
      }

      const fallbackLat = 37.566826, fallbackLng = 126.9786567;
      let userPosition = { lat: fallbackLat, lng: fallbackLng };

      let allToilets = [];
      let indexById = new Map();

      let markers = [];
      let openInfoWindow = null;
      let openMarker = null;
      let openInfoContentEl = null;
      let sharedInfoWindow = null;

      let clusterer = null;
      const CLUSTER_ON_LEVEL = 5;

      let map;
      let userInteracted = false;

      let sse = null;
      const SSE_URL = '/sse/ratings';

      let renderSeq = 0;
      const perf = window.performance;
      let geoWatchId = null;

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => {
            userPosition = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            initMap(userPosition.lat, userPosition.lng);
          },
          err => {
            console.warn('위치 정보 불가, 기본 위치 사용', err);
            initMap(fallbackLat, fallbackLng);
          },
          { enableHighAccuracy: true, timeout: 3000 }
        );
      } else {
        initMap(fallbackLat, fallbackLng);
      }

      function initMap(lat, lng) {
        map = new kakao.maps.Map(document.getElementById('map'), {
          center: new kakao.maps.LatLng(lat, lng),
          level: 3
        });

        sharedInfoWindow = new kakao.maps.InfoWindow({ removable: true });

        clusterer = new kakao.maps.MarkerClusterer({
          map: map,
          averageCenter: true,
          minLevel: CLUSTER_ON_LEVEL,
          disableClickZoom: false
        });

        map.setMinLevel(1);
        map.setMaxLevel(6);

        if (navigator.geolocation) {
          geoWatchId = navigator.geolocation.watchPosition(
            pos => {
              userPosition = { lat: pos.coords.latitude, lng: pos.coords.longitude };
              if (!userInteracted) {
                map.setCenter(new kakao.maps.LatLng(userPosition.lat, userPosition.lng));
                debouncedRender();
              }
            },
            console.error,
            { enableHighAccuracy: true, maximumAge: 30000, timeout: 27000 }
          );
        }

        const makePinDataUrl = (fill, dotFill = '#ffffff') => {
          const color = typeof fill === 'string' && /^#[0-9a-fA-F]{6}$/.test(fill) ? fill : '#757575';
          const dot = typeof dotFill === 'string' && /^#[0-9a-fA-F]{6}$/.test(dotFill) ? dotFill : '#ffffff';
          const svg =
            `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 64">
               <defs><filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
                 <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.35"/></filter></defs>
               <path fill="${color}" filter="url(#shadow)"
                     d="M24 0C12.954 0 4 8.954 4 20c0 13.255 20 44 20 44s20-30.745 20-44C44 8.954 35.046 0 24 0z"/>
               <circle cx="24" cy="20" r="7" fill="${dot}"/>
             </svg>`;
          return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
        };

        const COLORS = {
          male: { normal:'#1E88E5', active:'#1565C0' },
          female: { normal:'#E53935', active:'#C62828' },
          disabled: { normal:'#FDD835', active:'#F9A825' },
          unknown: { normal:'#757575', active:'#424242' }
        };

        const imageSize = new kakao.maps.Size(36, 48);
        const imageOpt  = { offset: new kakao.maps.Point(18, 48) };

        const markerImage = (type, active=false) =>
          new kakao.maps.MarkerImage(makePinDataUrl(COLORS[type][active?'active':'normal']), imageSize, imageOpt);

        const inferType = (t) => {
          if (t.markerType) return t.markerType;
          const v4 = (t.value04 || t.value_04 || '').toString();
          const v5 = (t.value05 || t.value_05 || '').toString();
          if (/장애인/.test(v4) || /장애인/.test(v5)) return 'disabled';
          const hasM = /남/.test(v4) || /남/.test(v5);
          const hasF = /여/.test(v4) || /여/.test(v5);
          if (hasM && !hasF) return 'male';
          if (!hasM && hasF) return 'female';
          return 'unknown';
        };

        const haversine = (lat1, lng1, lat2, lng2) => {
          const R = 6371000;
          const toRad = d => d * Math.PI / 180;
          const dLat = toRad(lat2 - lat1);
          const dLng = toRad(lng2 - lng1);
          const a = Math.sin(dLat/2)**2 +
            Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
          const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
          return R * c;
        };

        const debounce = (fn, delay = 150) => {
          let tid;
          return (...args) => {
            clearTimeout(tid);
            tid = setTimeout(() => fn(...args), delay);
          };
        };

        // Bounded max-heap (Top-N nearest)
        class BoundedMaxHeap {
          constructor(limit) { this.h = []; this.limit = limit; }
          push(node) {
            this.h.push(node); this._up(this.h.length - 1);
            if (this.h.length > this.limit) this.pop();
          }
          pop() {
            if (!this.h.length) return null;
            const top = this.h[0];
            const last = this.h.pop();
            if (this.h.length) { this.h[0] = last; this._down(0); }
            return top;
          }
          toArray() { return [...this.h]; }
          _up(i) {
            while (i > 0) {
              const p = (i - 1) >> 1;
              if (this.h[p].dist >= this.h[i].dist) break;
              [this.h[p], this.h[i]] = [this.h[i], this.h[p]];
              i = p;
            }
          }
          _down(i) {
            const n = this.h.length;
            while (true) {
              let l = i*2 + 1, r = l + 1, largest = i;
              if (l < n && this.h[l].dist > this.h[largest].dist) largest = l;
              if (r < n && this.h[r].dist > this.h[largest].dist) largest = r;
              if (largest === i) break;
              [this.h[i], this.h[largest]] = [this.h[largest], this.h[i]];
              i = largest;
            }
          }
        }

        const limitForZoom = (level) => {
          if (level <= 3) return 30;
          if (level <= 5) return 60;
          return 80;
        };

        const clearMarkers = () => {
          if (clusterer) clusterer.clear();

          markers.forEach(m => m.setMap(null));
          markers = [];

          if (openInfoWindow && openMarker) {
            openInfoWindow.close();
            openInfoWindow = null;
            openMarker = null;
            openInfoContentEl = null;
          }
        };

        const resizeInfoWindowToContent = (contentEl) => {
          if (!contentEl) return;
          setTimeout(() => {
            const wrapper = contentEl.parentElement && contentEl.parentElement.parentElement;
            if (wrapper) wrapper.style.height = contentEl.scrollHeight + 'px';
          }, 50);
        };

        const buildInfoContentSafe = (t) => {
          const avgRaw = Number(t && t.avgRating != null ? t.avgRating : 0);
          const avgNum = Number.isFinite(avgRaw) ? Math.max(0, Math.min(5, avgRaw)) : 0;
          const avgTxt = avgNum.toFixed(1);

          const cntRaw = Number(t && t.reviewCount != null ? t.reviewCount : 0);
          const cnt = Number.isFinite(cntRaw) && cntRaw > 0 ? Math.floor(cntRaw) : 0;

          const percent = Math.max(0, Math.min(100, (avgNum / 5) * 100)).toFixed(0);

          const wrap = document.createElement('div');
          wrap.className = 'draggable-iw';
          wrap.style.cssText = 'padding:8px;font-size:14px;max-width:260px;max-height:200px;overflow-y:auto;word-break:break-word;';

          const topRow = document.createElement('div');
          topRow.style.cssText = 'display:flex;align-items:center;gap:6px;';

          const icon = document.createElement('i');
          icon.className = 'bi bi-badge-wc';
          icon.setAttribute('aria-hidden', 'true');
          icon.style.fontSize = '20px';

          const name = document.createElement('strong');
          name.style.cssText = 'font-size:18px;line-height:1.2;';
          name.textContent = t.contsName ?? '';

          topRow.appendChild(icon);
          topRow.appendChild(name);
          wrap.appendChild(topRow);

          const ratingRow = document.createElement('div');
          ratingRow.style.cssText = 'margin-top:8px;display:flex;align-items:center;gap:6px;';

          const link = document.createElement('a');
          link.href = '/reviews?toiletId=' + encodeURIComponent(String(t.id ?? ''));
          link.style.cssText = 'text-decoration:none;color:inherit;display:inline-flex;align-items:center;gap:6px;';

          const stars = document.createElement('span');
          stars.className = 'iw-stars';
          stars.setAttribute('aria-label', '평점 ' + avgTxt);

          const starsOuter = document.createElement('span');
          starsOuter.className = 'iw-stars-outer';
          starsOuter.textContent = '★★★★★';

          const starsInner = document.createElement('span');
          starsInner.className = 'iw-stars-inner';
          starsInner.style.width = percent + '%';
          starsInner.textContent = '★★★★★';

          stars.appendChild(starsOuter);
          stars.appendChild(starsInner);

          const avgText = document.createElement('span');
          avgText.textContent = avgTxt + ' / 5';

          link.appendChild(stars);
          link.appendChild(avgText);

          ratingRow.appendChild(link);

          const cntText = document.createElement('span');
          cntText.style.color = '#888';
          cntText.textContent = '(' + cnt + ')';

          ratingRow.appendChild(cntText);
          wrap.appendChild(ratingRow);

          const addrWrap = document.createElement('div');
          addrWrap.style.cssText = 'margin-top:6px;color:#222;';

          if (t.addrNew) {
            const road = document.createElement('div');
            road.textContent = '도로명 ' + t.addrNew;
            addrWrap.appendChild(road);
          }
          if (t.addrOld) {
            const jibun = document.createElement('div');
            jibun.textContent = '지번 ' + t.addrOld;
            addrWrap.appendChild(jibun);
          }

          wrap.appendChild(addrWrap);
          return wrap;
        };

        // 클러스터(줌아웃) = viewport 전체 / 비클러스터(줌인) = Top-N 유지
        const renderMarkers = () => {
          const seq = ++renderSeq;
          const t0 = perf && perf.now ? perf.now() : Date.now();
          if (!Array.isArray(allToilets) || allToilets.length === 0) return;

          clearMarkers();

          const center = map.getCenter();
          const origin = { lat: center.getLat(), lng: center.getLng() };

          const level = map.getLevel();
          const useCluster = level >= CLUSTER_ON_LEVEL;

          const bounds = map.getBounds();
          const sw = bounds.getSouthWest(), ne = bounds.getNorthEast();

          const filtered = allToilets.filter(t => {
            if (t.coordY == null || t.coordX == null) return false;
            return t.coordY >= sw.getLat() && t.coordY <= ne.getLat()
                && t.coordX >= sw.getLng() && t.coordX <= ne.getLng();
          });

          let selectedToilets;

          if (useCluster) {
            // 클러스터 모드: viewport 내 전체 대상
            selectedToilets = filtered;
          } else {
            // 기존 Top-N
            const limit = limitForZoom(level);
            const heap = new BoundedMaxHeap(limit);
            filtered.forEach(t => {
              const dist = haversine(origin.lat, origin.lng, t.coordY, t.coordX);
              heap.push({ toilet: t, dist });
            });
            selectedToilets = heap.toArray()
              .sort((a,b)=>a.dist-b.dist)
              .map(x=>x.toilet);
          }

          selectedToilets.forEach(t => {
            const type = inferType(t);
            const position = new kakao.maps.LatLng(t.coordY, t.coordX);

            const marker = new kakao.maps.Marker({ position, image: markerImage(type, false) });
            marker.__toiletId = t.id;

            if (!useCluster) marker.setMap(map);

            kakao.maps.event.addListener(marker, 'click', function() {
              if (openInfoWindow && openMarker === marker) {
                openInfoWindow.close();
                marker.setImage(markerImage(type, false));
                openInfoWindow = openMarker = openInfoContentEl = null;
                return;
              }

              if (openInfoWindow && openMarker) {
                openInfoWindow.close();
                openMarker.setImage(openMarker.__inactiveImage || markerImage('unknown', false));
                openInfoContentEl = null;
              }

              marker.__inactiveImage = markerImage(type, false);

              const b = map.getBounds();
              if (!b.contain(position)) map.panTo(position);

              const contentEl = buildInfoContentSafe(t);
              sharedInfoWindow.setContent(contentEl);
              sharedInfoWindow.open(map, marker);

              marker.setImage(markerImage(type, true));
              openInfoWindow = sharedInfoWindow;
              openMarker = marker;
              openInfoContentEl = contentEl;

              resizeInfoWindowToContent(contentEl);
            });

            markers.push(marker);
          });

          if (useCluster && clusterer) {
            clusterer.addMarkers(markers);
          }

          setStatus(`공공 화장실 · ${selectedToilets.length}개 (zoom:${level})`, 'ok');

          const t1 = perf && perf.now ? perf.now() : Date.now();
          console.log(
            `[renderMarkers#${seq}] total=${(t1 - t0).toFixed(1)}ms ` +
            `filtered=${filtered.length} selected=${selectedToilets.length} zoom=${level} clustered=${useCluster}`
          );
        };

        const debouncedRender = debounce(renderMarkers, 120);

        kakao.maps.event.addListener(map, 'zoom_changed', () => debouncedRender());
        kakao.maps.event.addListener(map, 'zoom_start', () => { userInteracted = true; });
        kakao.maps.event.addListener(map, 'dragstart', () => { userInteracted = true; });
        kakao.maps.event.addListener(map, 'idle', () => debouncedRender());

        const applyRatingUpdate = (update) => {
          if (!update || update.toiletId == null) return;
          const idx = indexById.get(update.toiletId);
          if (idx == null) return;

          const t = allToilets[idx];
          const nextAvg = Number(update.avgRating);
          const nextCnt = Number(update.reviewCount);

          t.avgRating = Number.isFinite(nextAvg) ? Math.max(0, Math.min(5, nextAvg)) : 0;
          t.reviewCount = Number.isFinite(nextCnt) && nextCnt > 0 ? Math.floor(nextCnt) : 0;

          if (openMarker && openMarker.__toiletId === update.toiletId && sharedInfoWindow) {
            const nextContentEl = buildInfoContentSafe(t);
            sharedInfoWindow.setContent(nextContentEl);
            openInfoContentEl = nextContentEl;
            resizeInfoWindowToContent(nextContentEl);
          }
        };

        const connectSse = () => {
          if (sse) return;
          sse = new EventSource(SSE_URL);
          sse.addEventListener('rating-updated', (e) => {
            try {
              const update = JSON.parse(e.data);
              applyRatingUpdate(update);
            } catch (err) {
              console.warn('SSE parse error', err);
            }
          });
          sse.onerror = () => { /* auto reconnect */ };
        };

        const closeSse = () => {
          if (!sse) return;
          sse.close();
          sse = null;
        };

        const stopGeoWatch = () => {
          if (geoWatchId != null) {
            navigator.geolocation.clearWatch(geoWatchId);
            geoWatchId = null;
          }
        };

        window.addEventListener('pagehide', closeSse);
        window.addEventListener('beforeunload', closeSse);
        document.addEventListener('visibilitychange', () => { if (document.hidden) closeSse(); });

        window.addEventListener('pagehide', stopGeoWatch);
        window.addEventListener('beforeunload', stopGeoWatch);
        document.addEventListener('visibilitychange', () => { if (document.hidden) stopGeoWatch(); });

        // 평점 포함 데이터 로드
        const toiletsApiUrl = /*[[@{/toilets(withRatings=true)}]]*/ '/toilets?withRatings=true';
        const fetchStart = perf && perf.now ? perf.now() : Date.now();
        fetch(toiletsApiUrl)
          .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
          .then(full => {
            if (!Array.isArray(full) || full.length === 0) {
              setStatus('데이터 0개', 'warn');
              return;
            }

            allToilets = full;
            indexById = new Map();
            allToilets.forEach((t, i) => { if (t && t.id != null) indexById.set(t.id, i); });

            debouncedRender();

            const fetchEnd = perf && perf.now ? perf.now() : Date.now();
            console.log(`[fetch/toilets] items=${full.length} total=${(fetchEnd - fetchStart).toFixed(1)}ms`);

            setStatus(`공공 화장실 · ${full.length}개 (평점 포함)`, 'ok');
            connectSse();
          })
          .catch(err => {
            console.error('데이터 로드 실패:', err);
            setStatus('데이터 로드 실패 · 콘솔 확인', 'warn');
          });
      }
    });
    /*]]>*/
</script>
</body>
</html>
