<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="${toilet.contsName} + ' 리뷰'">리뷰</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .iw-stars { position: relative; display: inline-block; line-height: 1; vertical-align: middle; font-size: 24px; margin-right: 6px; }
        .iw-stars-outer { color: #c9c9c9; }
        .iw-stars-inner { position: absolute; top: 0; left: 0; white-space: nowrap; overflow: hidden; color: #ffb400; }

        .star-rating { display:inline-flex; flex-direction:row-reverse; gap:4px; }
        .star-rating input { position:absolute; left:-9999px; }
        .star-rating label { font-size:28px; line-height:1; cursor:pointer; color:#c9c9c9; transition:transform .08s ease, color .12s ease; user-select:none; }
        .star-rating label:hover, .star-rating label:hover ~ label { color:#ffb400; transform:scale(1.05); }
        .star-rating input:checked ~ label { color:#ffb400; }

        .stars { display:inline-flex; gap:2px; font-size:20px; line-height:1; vertical-align:middle; }
        .star { color:#c9c9c9; }
        .star.filled { color:#ffb400; }

        .meta { color:#666; font-size:14px; }
        .empty { color:#999; padding:8px 0; }

        body { text-align: center; }
        table { margin: 0 auto; border-collapse: collapse; }
        .top-auth { max-width: 860px; margin: 20px auto 0; text-align: right; }
        .review-table-wrap { width: 78%; margin: 0 auto; overflow-x: auto; }
        .review-table {
            width: 100%;
            table-layout: fixed;
            border-collapse: separate;
            border-spacing: 0;
            border: 1px solid #e6e8eb;
            border-radius: 10px;
            overflow: hidden;
            background: #fff;
        }
        .review-table thead th {
            background: #f8f9fb;
            color: #3f4652;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            padding: 10px 8px;
            border-bottom: 1px solid #e6e8eb;
            white-space: nowrap;
        }
        .review-table tbody td {
            padding: 10px 8px;
            border-bottom: 1px solid #f0f2f5;
            vertical-align: middle;
            font-size: 14px;
        }
        .review-table tbody tr:last-child td { border-bottom: none; }
        .col-rating { width: 16%; text-align: center; }
        .col-review { width: 38%; text-align: left; }
        .col-author { width: 14%; text-align: center; color: #4b5563; }
        .col-date { width: 18%; text-align: center; color: #6b7280; }
        .col-action { width: 14%; text-align: center; }
        .review-comment {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
            line-height: 1.45;
            text-align: left;
        }
        .action-group {
            display: inline-flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }
    </style>

    <script>
        function openReviewForm() {
            document.getElementById('reviewFormDiv').style.display = 'block';
            const btn = document.getElementById('openReviewBtn');
            if (btn) btn.style.display = 'none';
        }
        function cancelReviewForm() {
            const formDiv = document.getElementById('reviewFormDiv');
            formDiv.style.display = 'none';
            const btn = document.getElementById('openReviewBtn');
            if (btn) btn.style.display = 'inline-block';
            const form = formDiv.querySelector('form');
            if (form) form.reset();
        }
        function toggleEdit(id) {
            const row = document.getElementById('edit-row-' + id);
            if (!row) return;
            row.style.display = row.style.display === 'none' ? 'table-row' : 'none';
        }
    </script>
</head>

<body>
<div class="top-auth">
    <span th:if="${isLoggedIn}" class="me-2">
        <strong th:text="${loginUsername}">user</strong>
    </span>
    <a href="#" th:if="${!isLoggedIn}" data-bs-toggle="modal" data-bs-target="#loginModal">로그인</a>
    <form th:if="${isLoggedIn}" th:action="@{/logout}" method="post" style="display:inline;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="redirect" th:value="${loginRedirect}">
        <button type="submit" class="btn btn-link p-0 align-baseline">로그아웃</button>
    </form>
    <button th:if="${isLoggedIn}" type="button" class="btn btn-link p-0 ms-2 align-baseline text-danger"
            data-bs-toggle="modal" data-bs-target="#deleteAccountModal">회원탈퇴</button>
</div>

<h1 th:text="${toilet.contsName}" class="mt-5 mb-4">화장실 이름</h1>

<div class="container" style="max-width: 860px;">
    <div th:if="${errorMessage != null and !#strings.isEmpty(errorMessage)}"
         class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}">오류 메시지</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${infoMessage != null and !#strings.isEmpty(infoMessage)}"
         class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${infoMessage}">성공 메시지</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${warnMessage != null and !#strings.isEmpty(warnMessage)}"
         class="alert alert-warning alert-dismissible fade show" role="alert">
        <span th:text="${warnMessage}">안내 메시지</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<div class="meta" style="max-width: 860px; margin: 0 auto; text-align:right;">
    조회 수 <span th:text="${pageViewCount}">0</span>
</div>

<div class="meta">
    <span class="iw-stars" th:attr="aria-label=|평점 ${#numbers.formatDecimal(avgRating,1,1)}|">
        <span class="iw-stars-outer">★★★★★</span>
        <span class="iw-stars-inner" id="avgStars" th:style="'width:' + (${avgRating} * 20) + '%'">★★★★★</span>
    </span>

    <span id="avgText" th:text="${#numbers.formatDecimal(avgRating,1,1)} + ' / 5'">0.0 / 5</span>
    <span class="meta">(<span id="reviewCount" th:text="${#lists.size(reviews)}">0</span>)</span>
    &nbsp;<a th:href="@{/map}">지도 보기</a>
</div>

<br>

<div id="liveNotice" class="meta" style="display:none; color:#2e7d32;">
    실시간 업데이트가 반영되었습니다. (리뷰 목록은 새로고침 시 갱신됩니다)
</div>

<div style="text-align: right; width: 60%; margin: 0 auto;">
    <button th:if="${isLoggedIn}" type="button" id="openReviewBtn" onclick="openReviewForm()" class="btn btn-primary">리뷰 작성하기</button>
    <button th:if="${!isLoggedIn}" type="button" class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#loginModal">로그인 후 리뷰 작성</button>
</div>

<div id="reviewFormDiv" style="display:none; margin:20px auto; padding:16px; border:1px solid #ccc; border-radius:8px; text-align:center; width:fit-content;">
    <form th:action="@{/reviews}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="toiletId" th:value="${toilet.id}"/>

        <div class="star-rating" aria-label="별점 선택">
            <input type="radio" th:id="|star5-${toilet.id}|" name="rating" value="5" required><label th:for="|star5-${toilet.id}|" title="5점">★</label>
            <input type="radio" th:id="|star4-${toilet.id}|" name="rating" value="4"><label th:for="|star4-${toilet.id}|" title="4점">★</label>
            <input type="radio" th:id="|star3-${toilet.id}|" name="rating" value="3"><label th:for="|star3-${toilet.id}|" title="3점">★</label>
            <input type="radio" th:id="|star2-${toilet.id}|" name="rating" value="2"><label th:for="|star2-${toilet.id}|" title="2점">★</label>
            <input type="radio" th:id="|star1-${toilet.id}|" name="rating" value="1"><label th:for="|star1-${toilet.id}|" title="1점">★</label>
        </div>

        <br/>
        <label>
            <textarea name="comment" rows="3" cols="40" placeholder="이용 소감, 청결도/비고/보안" maxlength="1000"></textarea>
        </label>
        <br/>

        <div style="display:flex; gap:8px; justify-content:center;">
            <button type="submit" class="btn btn-primary">등록</button>
            <button type="button" onclick="cancelReviewForm()" class="btn btn-danger">취소</button>
        </div>
    </form>
</div>

<ul style="list-style-type: none;" th:if="${#lists.isEmpty(reviews)}">
    <li class="empty">아직 등록된 리뷰가 없습니다. 의견을 남겨주세요.</li>
</ul>

<div class="review-table-wrap" th:unless="${#lists.isEmpty(reviews)}">
<table class="review-table">
    <colgroup>
        <col class="col-rating">
        <col class="col-review">
        <col class="col-author">
        <col class="col-date">
        <col class="col-action">
    </colgroup>
    <thead>
    <tr>
        <th>별점</th>
        <th>리뷰</th>
        <th>작성자</th>
        <th>등록일</th>
        <th>관리</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="rev : ${reviews}">
        <td class="col-rating">
            <span class="stars" th:with="r=${rev.rating}">
                <span class="star" th:each="i : ${#numbers.sequence(1,5)}"
                      th:classappend="${i <= r} ? ' filled' : ''"
                      th:title="|별점 ${r}/5|">★</span>
            </span>
        </td>

        <td class="col-review">
            <div class="review-comment" th:text="${rev.comment ?: ''}">리뷰</div>
        </td>

        <td class="col-author"
            th:text="${rev.ownerUsername != null and !#strings.isEmpty(rev.ownerUsername) ? rev.ownerUsername : '-'}">-</td>

        <td class="col-date">
            <small class="meta" th:text="${rev.createdAt}">2025-08-10 12:00</small>
        </td>

        <td class="col-action">
            <div class="action-group">
                <button th:if="${rev.ownedByLoginUser}" type="button" class="btn btn-sm btn-outline-secondary"
                        th:attr="onclick=|toggleEdit(''+${rev.id})|">수정</button>

                <form th:if="${rev.ownedByLoginUser}" th:action="@{/reviews/delete}" method="post" style="display:inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="reviewId" th:value="${rev.id}">
                    <input type="hidden" name="toiletId" th:value="${toilet.id}">
                    <button type="submit" class="btn btn-sm btn-outline-danger">삭제</button>
                </form>

                <form th:action="@{/reviews/report}" method="post" style="display:inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="reviewId" th:value="${rev.id}">
                    <input type="hidden" name="toiletId" th:value="${toilet.id}">
                    <button type="submit" class="btn btn-sm btn-outline-warning">신고</button>
                </form>
            </div>

            <div style="margin-top:4px; font-size:12px; color:#777;" th:if="${rev.reportCount > 0}">
                <span th:text="|신고 ${rev.reportCount}회|">신고 0회</span>
            </div>
        </td>
    </tr>

    <tr th:each="rev : ${reviews}" th:if="${rev.ownedByLoginUser}" th:id="|edit-row-${rev.id}|" style="display:none;">
        <td colspan="5" style="background:#f9f9f9; padding:10px;">
            <form th:action="@{/reviews/update}" method="post" style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="reviewId" th:value="${rev.id}">
                <input type="hidden" name="toiletId" th:value="${toilet.id}">

                <div>
                    <label class="form-label" th:for="|rating-${rev.id}|">별점</label>
                    <select class="form-select form-select-sm" th:id="|rating-${rev.id}|" name="rating">
                        <option th:value="5" th:selected="${rev.rating == 5}">5</option>
                        <option th:value="4" th:selected="${rev.rating == 4}">4</option>
                        <option th:value="3" th:selected="${rev.rating == 3}">3</option>
                        <option th:value="2" th:selected="${rev.rating == 2}">2</option>
                        <option th:value="1" th:selected="${rev.rating == 1}">1</option>
                    </select>
                </div>

                <div style="flex:1; min-width:240px;">
                    <label class="form-label">리뷰 내용</label>
                    <textarea name="comment" rows="2" class="form-control" maxlength="1000" th:text="${rev.comment}"></textarea>
                </div>

                <div style="display:flex; gap:6px;">
                    <button type="submit" class="btn btn-sm btn-primary">수정 완료</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary" th:attr="onclick=|toggleEdit(''+${rev.id})|">취소</button>
                </div>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</div>

<div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-sm modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="h6 mb-0">로그인</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body text-start">
                <form th:action="@{/login}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="redirect" th:value="${loginRedirect}">
                    <div class="mb-2">
                        <label for="loginUsername" class="form-label mb-1">아이디</label>
                        <input id="loginUsername" name="username" type="text" class="form-control form-control-sm" required>
                    </div>
                    <div class="mb-2">
                        <label for="loginPassword" class="form-label mb-1">비밀번호</label>
                        <input id="loginPassword" name="password" type="password" class="form-control form-control-sm" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-sm w-100">로그인</button>
                </form>
                <div class="mt-3 text-center">
                    <a th:href="@{/signup(redirect=${loginRedirect})}">회원가입</a>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="deleteAccountModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-sm modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="h6 mb-0">회원탈퇴</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body text-start">
                <p class="small text-danger mb-2">탈퇴하면 계정 정보가 삭제됩니다.</p>
                <form th:action="@{/account/delete}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="redirect" th:value="${loginRedirect}">
                    <div class="mb-2">
                        <label for="deleteAccountPassword" class="form-label mb-1">비밀번호 확인</label>
                        <input id="deleteAccountPassword" name="password" type="password" class="form-control form-control-sm" required>
                    </div>
                    <button type="submit" class="btn btn-danger btn-sm w-100">탈퇴하기</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    const toiletId = /*[[${toilet.id}]]*/ 0;
    const avgTextEl = document.getElementById('avgText');
    const avgStarsEl = document.getElementById('avgStars');
    const reviewCountEl = document.getElementById('reviewCount');
    const liveNotice = document.getElementById('liveNotice');

    const SSE_URL = '/sse/ratings';
    let sse = null;

    const openRatingSse = () => {
        if (sse) return;
        const url = `${SSE_URL}?toiletId=${encodeURIComponent(toiletId)}`;
        sse = new EventSource(url);
        sse.addEventListener('rating-updated', (e) => {
            try {
                const data = JSON.parse(e.data);
                if (!data || data.toiletId !== toiletId) return;
                const avg = Number(data.avgRating || 0);
                if (avgTextEl) avgTextEl.textContent = avg.toFixed(1) + ' / 5';
                if (avgStarsEl) {
                    const pct = Math.max(0, Math.min(100, avg * 20));
                    avgStarsEl.style.width = pct + '%';
                }
                if (reviewCountEl) reviewCountEl.textContent = data.reviewCount ?? 0;
                if (liveNotice) liveNotice.style.display = 'block';
            } catch (err) {
                console.warn('SSE parse error', err);
            }
        });
    };

    const closeRatingSse = () => {
        if (!sse) return;
        sse.close();
        sse = null;
    };

    if (toiletId) {
        openRatingSse();
        window.addEventListener('pagehide', closeRatingSse);
        window.addEventListener('beforeunload', closeRatingSse);
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) closeRatingSse();
        });
    }
    /*]]>*/
</script>
</body>
</html>
