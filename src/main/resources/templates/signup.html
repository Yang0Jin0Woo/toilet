<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 520px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h1 class="h4 mb-3">Create Account</h1>

            <div th:if="${errorMessage != null and !#strings.isEmpty(errorMessage)}"
                 class="alert alert-danger py-2"
                 role="alert">
                <span th:text="${errorMessage}">Error</span>
            </div>
            <div th:if="${infoMessage != null and !#strings.isEmpty(infoMessage)}"
                 class="alert alert-success py-2"
                 role="alert">
                <span th:text="${infoMessage}">Done</span>
            </div>

            <form th:action="@{/signup}" method="post" th:object="${signupForm}">
                <input type="hidden" name="redirect" th:value="${redirect}"/>

                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input id="username"
                           type="text"
                           class="form-control"
                           th:field="*{username}"
                           placeholder="4-20 chars, letters/numbers/_"
                           required>
                    <div class="text-danger small mt-1"
                         th:if="${#fields.hasErrors('username')}"
                         th:errors="*{username}">Username error</div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input id="password"
                           type="password"
                           class="form-control"
                           th:field="*{password}"
                           placeholder="At least 8 characters"
                           required>
                    <div class="text-danger small mt-1"
                         th:if="${#fields.hasErrors('password')}"
                         th:errors="*{password}">Password error</div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input id="email"
                           type="email"
                           class="form-control"
                           th:field="*{email}"
                           placeholder="you@example.com"
                           required>
                    <div class="text-danger small mt-1"
                         th:if="${#fields.hasErrors('email')}"
                         th:errors="*{email}">Email error</div>
                </div>

                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input id="confirmPassword"
                           type="password"
                           class="form-control"
                           th:field="*{confirmPassword}"
                           required>
                    <div class="text-danger small mt-1"
                         th:if="${#fields.hasErrors('confirmPassword')}"
                         th:errors="*{confirmPassword}">Confirm error</div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Sign Up</button>
                    <a class="btn btn-outline-secondary" th:href="${redirect}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
