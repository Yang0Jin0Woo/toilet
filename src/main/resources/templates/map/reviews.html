<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="${toilet.contsName} + ' 리뷰'">리뷰</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 별점 뷰 */
        .iw-stars { position: relative; display: inline-block; line-height: 1; vertical-align: middle; font-size: 24px; margin-right: 6px; }
        .iw-stars-outer { color: #c9c9c9; }
        .iw-stars-inner { position: absolute; top: 0; left: 0; white-space: nowrap; overflow: hidden; color: #ffb400; }

        /* 작성용 별점 */
        .star-rating { display:inline-flex; flex-direction:row-reverse; gap:4px; }
        .star-rating input { position:absolute; left:-9999px; }
        .star-rating label { font-size:28px; line-height:1; cursor:pointer; color:#c9c9c9; transition:transform .08s ease, color .12s ease; user-select:none; }
        .star-rating label:hover, .star-rating label:hover ~ label { color:#ffb400; transform:scale(1.05); }
        .star-rating input:checked ~ label { color:#ffb400; }

        /* 목록 별점 */
        .stars { display:inline-flex; gap:2px; font-size:20px; line-height:1; vertical-align:middle; }
        .star { color:#c9c9c9; }
        .star.filled { color:#ffb400; }

        .meta { color:#666; font-size:14px; }
        .empty { color:#999; padding:8px 0; }

        body { text-align: center; }
        table { margin: 0 auto; border-collapse: collapse; }
    </style>
    <script>
        function openReviewForm() {
           document.getElementById('reviewFormDiv').style.display = 'block';
           document.getElementById('openReviewBtn').style.display = 'none';
        }
        function cancelReviewForm() {
          const formDiv = document.getElementById('reviewFormDiv');
          formDiv.style.display = 'none';
          document.getElementById('openReviewBtn').style.display = 'inline-block';
          const form = formDiv.querySelector('form');
          if (form) form.reset();
        }
        function toggleEdit(id) {
            const row = document.getElementById('edit-row-' + id);
            if (!row) return;
            row.style.display = row.style.display === 'none' ? 'table-row' : 'none';
        }
    </script>
</head>
<body>
<h1 th:text="${toilet.contsName}" class="mt-5 mb-4">화장실 이름</h1>

<div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>
<div th:if="${infoMessage}" class="alert alert-success" role="alert" th:text="${infoMessage}"></div>

<div class="meta">
    <span class="iw-stars"
          th:attr="aria-label=|평점 ${#numbers.formatDecimal(avgRating,1,1)}|">
    <span class="iw-stars-outer">★ ★ ★ ★ ★</span>
    <span class="iw-stars-inner"
          th:style="'width:' + (${avgRating} * 20) + '%'">★ ★ ★ ★ ★</span>
  </span>
    <span th:text="${#numbers.formatDecimal(avgRating,1,1)} + ' / 5'">0.0 / 5</span>
    &nbsp;<a th:href="@{/map}">지도 보기</a>
</div>

<br>

<div style="text-align: right; width: 60%; margin: 0 auto;">
    <button type="button" id="openReviewBtn" onclick="openReviewForm()" class="btn btn-primary">리뷰 작성하기</button>
  </div>

<div id="reviewFormDiv" style="display:none; margin:20px auto; padding:16px; border:1px solid #ccc; border-radius:8px; text-align:center; width:fit-content;">
    <form th:action="@{/reviews}" method="post">
        <input type="hidden" name="toiletId" th:value="${toilet.id}"/>

        <div class="star-rating" aria-label="별점 선택">
            <input type="radio" id="star5" name="rating" value="5" required><label for="star5" title="5점">★</label>
            <input type="radio" id="star4" name="rating" value="4"><label for="star4" title="4점">★</label>
            <input type="radio" id="star3" name="rating" value="3"><label for="star3" title="3점">★</label>
            <input type="radio" id="star2" name="rating" value="2"><label for="star2" title="2점">★</label>
            <input type="radio" id="star1" name="rating" value="1"><label for="star1" title="1점">★</label>
        </div>
        <br/>
        <label>
            <textarea name="comment" rows="3" cols="40" placeholder="이용 소감, 청결도/비고/보안" maxlength="1000"></textarea>
        </label>
        <br/>
        <div style="display:flex; gap:8px; justify-content:center;">
            <button type="submit" class="btn btn-primary">등록</button>
            <button type="button" onclick="cancelReviewForm()" class="btn btn-danger">취소</button>
        </div>
    </form>
</div>

<ul style="list-style-type: none;" th:if="${#lists.isEmpty(reviews)}">
    <li class="empty">아직 등록된 리뷰가 없습니다. 의견을 남겨주세요.</li>
</ul>

<table style="width:60%; border-collapse:collapse;" th:unless="${#lists.isEmpty(reviews)}">
    <thead>
    <tr>
        <th style="border-bottom:1px solid #ccc; text-align:center; padding:6px;">별점</th>
        <th style="border-bottom:1px solid #ccc; text-align:center; padding:6px;">리뷰</th>
        <th style="border-bottom:1px solid #ccc; text-align:center; padding:6px;">등록일</th>
        <th style="border-bottom:1px solid #ccc; text-align:center; padding:6px;">관리</th>
    </tr>
    </thead>
    <tbody>
        <tr th:each="rev : ${reviews}">
            <td style="padding:6px;">
                    <span class="stars" th:with="r=${rev.rating}">
                        <span class="star" th:each="i : ${#numbers.sequence(1,5)}"
                              th:classappend="${i <= r} ? ' filled' : ''"
                              th:title="|별점 ${r}/5|">★</span>
                    </span>
            </td>
            <td style="padding:6px; text-align:left;" th:text="${rev.comment ?: ''}">리뷰</td>
            <td style="padding:6px;">
                <small class="meta" th:text="${rev.createdAt}">2025-08-10 12:00</small>
            </td>
            <td style="padding:6px; text-align:center;">
                <div style="display:flex; gap:6px; justify-content:center; flex-wrap:wrap;">
                    <button type="button" class="btn btn-sm btn-outline-secondary"
                            th:attr="onclick=|toggleEdit(''+${rev.id})|">수정</button>
                    <form th:action="@{/reviews/delete}" method="post" style="display:inline;">
                        <input type="hidden" name="reviewId" th:value="${rev.id}">
                        <input type="hidden" name="toiletId" th:value="${toilet.id}">
                        <button type="submit" class="btn btn-sm btn-outline-danger">삭제</button>
                    </form>
                    <form th:action="@{/reviews/report}" method="post" style="display:inline;">
                        <input type="hidden" name="reviewId" th:value="${rev.id}">
                        <input type="hidden" name="toiletId" th:value="${toilet.id}">
                        <button type="submit" class="btn btn-sm btn-outline-warning">신고</button>
                    </form>
                </div>
                <div style="margin-top:4px; font-size:12px; color:#777;" th:if="${rev.reportCount > 0}">
                    <span th:text="|신고 ${rev.reportCount}회|">신고 0회</span>
                </div>
            </td>
        </tr>
        <tr th:each="rev : ${reviews}"
            th:id="|edit-row-${rev.id}|"
            style="display:none;">
            <td colspan="4" style="background:#f9f9f9; padding:10px;">
                <form th:action="@{/reviews/update}" method="post" style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
                    <input type="hidden" name="reviewId" th:value="${rev.id}">
                    <input type="hidden" name="toiletId" th:value="${toilet.id}">
                    <div>
                        <label for="rating" class="form-label">별점</label>
                        <select name="rating" class="form-select form-select-sm">
                            <option th:value="5" th:selected="${rev.rating == 5}">5</option>
                            <option th:value="4" th:selected="${rev.rating == 4}">4</option>
                            <option th:value="3" th:selected="${rev.rating == 3}">3</option>
                            <option th:value="2" th:selected="${rev.rating == 2}">2</option>
                            <option th:value="1" th:selected="${rev.rating == 1}">1</option>
                        </select>
                    </div>
                    <div style="flex:1; min-width:240px;">
                        <label class="form-label">리뷰 내용</label>
                        <textarea name="comment" rows="2" class="form-control" maxlength="1000"
                                  th:text="${rev.comment}"></textarea>
                    </div>
                    <div style="display:flex; gap:6px;">
                        <button type="submit" class="btn btn-sm btn-primary">수정 완료</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary"
                                th:attr="onclick=|toggleEdit(''+${rev.id})|">취소</button>
                    </div>
                </form>
            </td>
        </tr>
    </tbody>
    </table>
</body>
</html>
