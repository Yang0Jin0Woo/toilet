<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>회원가입</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5" style="max-width: 520px;">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 mb-3">계정 만들기</h1>

                <div th:if="${errorMessage != null and !#strings.isEmpty(errorMessage)}"
                     class="alert alert-danger py-2"
                     role="alert">
                    <span th:text="${errorMessage}">오류</span>
                </div>
                <div th:if="${infoMessage != null and !#strings.isEmpty(infoMessage)}"
                     class="alert alert-success py-2"
                     role="alert">
                    <span th:text="${infoMessage}">완료</span>
                </div>

                <form th:action="@{/signup}" method="post" th:object="${signupForm}">
                    <input type="hidden" name="redirect" th:value="${redirect}"/>

                    <div class="mb-3">
                        <label for="username" class="form-label">아이디</label>
                        <input id="username"
                               type="text"
                               class="form-control"
                               th:field="*{username}"
                               placeholder="4~20자, 영문/숫자/_"
                               required>
                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('username')}"
                             th:errors="*{username}">아이디 오류</div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">비밀번호</label>
                        <input id="password"
                               type="password"
                               class="form-control"
                               th:field="*{password}"
                               placeholder="8자 이상"
                               required>
                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('password')}"
                             th:errors="*{password}">비밀번호 오류</div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">이메일</label>
                        <input id="email"
                               type="email"
                               class="form-control"
                               th:field="*{email}"
                               placeholder="you@example.com"
                               required>
                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('email')}"
                             th:errors="*{email}">이메일 오류</div>
                    </div>

                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">비밀번호 확인</label>
                        <input id="confirmPassword"
                               type="password"
                               class="form-control"
                               th:field="*{confirmPassword}"
                               required>
                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('confirmPassword')}"
                             th:errors="*{confirmPassword}">비밀번호 확인 오류</div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">가입하기</button>
                        <a class="btn btn-outline-secondary" th:href="${redirect}">취소</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
